name: Update Org Profile README

on:
  schedule:
    # Hourly sync: keep repo list, cards, stars, forks & language mix constantly updated
    - cron: "0 * * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "profile/README.md"
      - "profile/cards/**"
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [repo-update, push, release, star, refresh-profile, ping]

permissions:
  contents: write
  # Only public data is read; no elevated scopes are needed or granted.

concurrency:
  group: update-profile-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh README from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_readme.py

      - name: Commit refreshed README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(readme): auto-refresh org stats & repos [skip ci]"
          file_pattern: "profile/**"
          commit_user_name: potenfyr-bot
          commit_user_email: actions@github.com
