  <g clip-path="url(#bar-clip)">
    <rect x="25.00" y="52" width="391.98" height="12" fill="#b07219"><title>Java: 52.3%</title></rect>
    <rect x="416.98" y="52" width="284.88" height="12" fill="#89e051"><title>Shell: 38.0%</title></rect>
